<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: poppins, sans-serif;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        row-gap: 0.5rem
    }

    header {
        display: flex;
        width: 100%;
        height: 4rem;
        align-items: center;
        padding-left: 1rem;
        background: orange;
    }

    section {
        padding: 0.5rem;
    }

    h2 {
        margin-bottom: 0.5rem;
    }

    img {
        width: 100%;
        max-width: 40rem;
        border-radius: 0.5rem;
    }

    video {
        width: 100%;
        max-width: 40rem;
        border-radius: 0.5rem;
    }

    @media screen and (max-width: 768px) {
        header {
            height: 3rem;
            font-size: 0.5em;
        }
    }
</style>

<body>

    <header>
        <h1>DBMS Modern Workbench Project Demo</h1>
    </header>
    
    <section id="video">
        <h2>Video</h2>
    
        <video controls>
            <source src="./DBMS_Project_Demo.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </section>
    
    <section id="photos">
        <h2>Photos</h2>
        
        <img src="./Screenshot1.png">
        <img src="./Screenshot2.png">
        <img src="./Screenshot3.png">
        <img src="./Screenshot4.png">
        <img src="./Screenshot5.png">
        <img src="./Screenshot6.png">
        <img src="./Screenshot7.png">
    </section>
</body>

</html>
